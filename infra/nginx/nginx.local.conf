events {}

http {
  upstream auth_backend     { server host.docker.internal:3001; }
  upstream users_backend    { server host.docker.internal:3002; }
  upstream catalog_backend  { server host.docker.internal:3003; }
  upstream reviews_backend  { server host.docker.internal:3004; }
  upstream cart_backend     { server host.docker.internal:3005; }
  upstream orders_backend   { server host.docker.internal:3006; }

  server {
    listen 80;

    location /api/auth/    { proxy_pass http://auth_backend; }
    location /api/users/   { proxy_pass http://users_backend; }
    location /api/books/   { proxy_pass http://catalog_backend; }
    location /api/reviews/ { proxy_pass http://reviews_backend; }
    location /api/cart     { proxy_pass http://cart_backend; }
    location /api/orders   { proxy_pass http://orders_backend; }

    location = /healthz { return 200 "ok\n"; }
  }
}
