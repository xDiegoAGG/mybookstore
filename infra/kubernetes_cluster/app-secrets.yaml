apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: mybookstore
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_STRONG_SECRET"
  AUTH_DATABASE_URL: "postgres://USER:PASS@AUTH_RDS_HOST:5432/authdb"
  USERS_DATABASE_URL: "postgres://USER:PASS@USERS_RDS_HOST:5432/usersdb"
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: mybookstore
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
  AWS_SESSION_TOKEN: "REPLACE_WITH_AWS_SESSION_TOKEN"
