apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: mybookstore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: <ECR_REGISTRY>/catalog-service:latest
          ports:
            - name: http
              containerPort: 3003
            - name: grpc
              containerPort: 50053
          env:
            - name: HTTP_PORT
              value: "3003"
            - name: GRPC_PORT
              value: "50053"
            - name: NODE_ENV
              value: "production"
            - name: AWS_REGION
              valueFrom: { configMapKeyRef: { name: app-config, key: AWS_REGION } }
            - name: BOOKS_TABLE
              valueFrom: { configMapKeyRef: { name: app-config, key: BOOKS_TABLE } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: aws-credentials, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: aws-credentials, key: AWS_SECRET_ACCESS_KEY } }
            - name: AWS_SESSION_TOKEN
              valueFrom: { secretKeyRef: { name: aws-credentials, key: AWS_SESSION_TOKEN } }
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
